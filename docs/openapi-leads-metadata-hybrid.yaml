openapi: 3.0.3
info:
  title: CRM Leads Metadata API (Hybrid)
  version: 1.0.0
  description: |
    Simplified OpenAPI contract for hybrid metadata strategy.
    - Lightweight static references in one endpoint.
    - Heavy/searchable metadata in dedicated paged endpoints.
servers:
  - url: http://localhost:8080
    description: Local backend

tags:
  - name: Leads Metadata

paths:
  /api/leads/references:
    get:
      tags: [Leads Metadata]
      summary: Get lightweight lead reference data
      description: Returns only lightweight static data for lead form bootstrap.
      operationId: getLeadReferences
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadReferencesResponse'
              examples:
                default:
                  value:
                    statuses:
                      - id: 1
                        code: NEW
                        name: Moi
                        order: 1
                        isDefault: true
                      - id: 2
                        code: CONTACTING
                        name: Dang lien he
                        order: 2
                        isDefault: false
                    sources:
                      - id: 1
                        code: WEB_FORM
                        name: Form Dang ky Website
                        order: 1
                      - id: 2
                        code: FACEBOOK_ADS
                        name: Facebook Ads
                        order: 2
                    meta:
                      version: '2026-04-20'
                      generatedAt: '2026-04-20T10:00:00'
                      cacheTtlSeconds: 86400
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/leads/metadata/assignees:
    get:
      tags: [Leads Metadata]
      summary: Search assignee users
      description: Paged metadata endpoint for assignee dropdown/autocomplete.
      operationId: searchAssignees
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: organizationId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: roleId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, LOCKED]
            default: ACTIVE
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [fullName, username, createdAt]
            default: fullName
        - $ref: '#/components/parameters/SortDir'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssigneePageResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/leads/metadata/products:
    get:
      tags: [Leads Metadata]
      summary: Search products
      description: Paged metadata endpoint for product dropdown/autocomplete.
      operationId: searchProducts
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [PRODUCT, SERVICE]
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [name, skuCode, createdAt]
            default: name
        - $ref: '#/components/parameters/SortDir'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPageResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/leads/metadata/provinces:
    get:
      tags: [Leads Metadata]
      summary: Search provinces/cities
      description: Paged metadata endpoint for province/city dropdown/autocomplete.
      operationId: searchProvinces
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: code
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [name, code, id]
            default: name
        - $ref: '#/components/parameters/SortDir'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvincePageResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  parameters:
    Q:
      name: q
      in: query
      required: false
      description: Search keyword for autocomplete/filtering.
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortDir:
      name: sortDir
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: asc

  schemas:
    LeadReferencesResponse:
      type: object
      required: [statuses, sources, meta]
      properties:
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/StatusOption'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceOption'
        meta:
          $ref: '#/components/schemas/ReferenceMeta'

    StatusOption:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        order:
          type: integer
        isDefault:
          type: boolean

    SourceOption:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        order:
          type: integer

    ReferenceMeta:
      type: object
      required: [version, generatedAt, cacheTtlSeconds]
      properties:
        version:
          type: string
        generatedAt:
          type: string
          format: date-time
        cacheTtlSeconds:
          type: integer

    AssigneeItem:
      type: object
      required: [id, code, name, status]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          description: Usually username
        name:
          type: string
          description: Usually fullName
        email:
          type: string
        organizationId:
          type: integer
          format: int64
        organizationName:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, LOCKED]

    ProductItem:
      type: object
      required: [id, code, name, type, isActive]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          description: Usually skuCode
        name:
          type: string
        type:
          type: string
          enum: [PRODUCT, SERVICE]
        isActive:
          type: boolean

    ProvinceItem:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string

    AssigneePageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages, hasNext, hasPrevious]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AssigneeItem'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean

    ProductPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages, hasNext, hasPrevious]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductItem'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean

    ProvincePageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages, hasNext, hasPrevious]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProvinceItem'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean

    LeadErrorResponse:
      type: object
      required: [status, errorCode, message, path, timestamp]
      properties:
        status:
          type: integer
        errorCode:
          type: string
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time

    ApiError:
      type: object
      required: [status, message, timestamp]
      properties:
        status:
          type: integer
        message:
          type: string
        timestamp:
          type: string
          format: date-time
